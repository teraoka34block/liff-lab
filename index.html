<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寺岡連合町内会</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; font-size: 18px; line-height: 1.6; }
    h2 { font-size: 22px; }
    .q { margin: 20px 0; }
    .q-title { font-weight: bold; margin-bottom: 8px; }
    label { display: block; padding: 12px; margin: 6px 0; border: 1px solid #ccc; border-radius: 8px; }
    input[type=radio] { margin-right: 8px; transform: scale(1.3); }
    input[type=text] { width: 100%; box-sizing: border-box; padding: 12px; font-size: 18px; border: 1px solid #ccc; border-radius: 8px; }
    button { width: 100%; padding: 14px; font-size: 18px; border: none; border-radius: 8px; margin-top: 12px; }
    button:disabled { opacity: 0.5; }
   #btn-confirm { position: sticky; bottom: 8px; }
    .primary { background: #06c755; color: #fff; }
    .secondary { background: #e0e0e0; }
    .error { color: #d00; min-height: 1.6em; }
    .hidden { display: none; }
    .box { background: #f5f5f5; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>

  <!-- 画面0：読み込み中 -->
  <div id="screen-loading">
    <p>読み込み中...</p>
  </div>

  <!-- 画面1：質問 -->
  <div id="screen-form" class="hidden">
    <h2 id="greeting"></h2>

    <div class="q">
      <div class="q-title">上のお名前がニックネームの場合は下記に本名を入力してください</div>
      <input type="text" id="realname" maxlength="50" autocomplete="name" placeholder="例：町内 太郎">
    </div>

    <div class="q">
      <div class="q-title">あなたの所在地は寺岡のどのエリアですか？</div>
      <label><input type="radio" name="area" value="1・2丁目">1・2丁目</label>
      <label><input type="radio" name="area" value="3・4丁目">3・4丁目</label>
      <label><input type="radio" name="area" value="5・6丁目">5・6丁目</label>
      <label><input type="radio" name="area" value="寺岡以外">寺岡以外</label>
    </div>

    <div class="q">
      <div class="q-title">いま現在のあなたの町内会での役割は？</div>
      <label><input type="radio" name="role" value="役員">役員</label>
      <label><input type="radio" name="role" value="班長">班長</label>
      <label><input type="radio" name="role" value="一般会員">一般会員</label>
      <label><input type="radio" name="role" value="非会員">非会員</label>
      <label><input type="radio" name="role" value="法人会員">法人会員（法人・店舗等で加入している方）</label>
    </div>

    <div id="error" class="error"></div>
    <button id="btn-confirm" class="primary">確認する</button>
  </div>

  <!-- 画面2：確認 -->
  <div id="screen-confirm" class="hidden">
    <h2>この内容で送信しますか？</h2>
    <div class="box">
      <p>LINEの名前：<span id="c-name"></span></p>
      <p>お名前（本名）：<span id="c-realname"></span></p>
      <p>エリア：<span id="c-area"></span></p>
      <p>役割：<span id="c-role"></span></p>
    </div>
    <div id="submit-msg" class="error"></div>
    <button id="btn-submit" class="primary">送信する</button>
    <button id="btn-back" class="secondary">戻って直す</button>
  </div>

  <!-- 画面3：完了 -->
  <div id="screen-done" class="hidden">
    <h2>ありがとうございました</h2>
    <p>回答を受け付けました。このまま画面を閉じてください。</p>
  </div>

  <script>
    const LIFF_ID = "2009952953-Dec51hwe";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz-7KSnhbtG_k6bpo0Mbug13FVHgO9ZZOSWbiObwypfMl0dqa76BMxSI8FAeV_BdWiw/exec";
    let displayName = "";
    let userId = "";

    // 表示する画面を切り替える
    function show(id) {
      ["screen-loading", "screen-form", "screen-confirm", "screen-done"].forEach(function (s) {
        document.getElementById(s).classList.toggle("hidden", s !== id);
      });
    }

    // 選ばれたラジオボタンの値を返す（未選択ならnull）
    function getValue(name) {
      const el = document.querySelector('input[name="' + name + '"]:checked');
      return el ? el.value : null;
    }

    // 本名の入力欄の値（前後の空白を取り除く。空欄でもよい）
    function getRealName() {
      return document.getElementById("realname").value.trim();
    }

    // 「確認する」ボタン（本名は必須にしていない）
    document.getElementById("btn-confirm").addEventListener("click", function () {
      const realName = getRealName();
      const area = getValue("area");
      const role = getValue("role");
      const err = document.getElementById("error");
      if (!area || !role) {
        err.textContent = "エリアと役割を選んでください";
        return;
      }
      err.textContent = "";
      document.getElementById("c-name").textContent = displayName;
      document.getElementById("c-realname").textContent = realName || "（LINEの名前と同じ）";
      document.getElementById("c-area").textContent = area;
      document.getElementById("c-role").textContent = role;
      document.getElementById("submit-msg").textContent = "";
      show("screen-confirm");
    });

    // 「戻って直す」ボタン
    document.getElementById("btn-back").addEventListener("click", function () {
      show("screen-form");
    });

    // 「送信する」ボタン（GASに送って、スプレッドシートに保存する）
    document.getElementById("btn-submit").addEventListener("click", function () {
      const btn = document.getElementById("btn-submit");
      const msg = document.getElementById("submit-msg");
      const data = {
        lineName: displayName,
        userId: userId,
        realName: getRealName(),   // 空欄なら、スプレッドシートの本名の列も空欄になる
        area: getValue("area"),
        role: getValue("role")
      };
      btn.disabled = true;          // 二重送信を防ぐ
      msg.textContent = "送信中です。少しお待ちください...";
      fetch(GAS_URL, { method: "POST", body: JSON.stringify(data) })
        .then(function (res) { return res.json(); })
        .then(function (result) {
          if (!result.ok) {
            throw new Error(result.error || "保存に失敗しました");
          }
          show("screen-done");
        })
        .catch(function (err) {
          msg.textContent = "送信できませんでした：" + err.message + "（もう一度お試しください）";
          btn.disabled = false;
        });
    });

    // LIFFの開始
    liff.init({ liffId: LIFF_ID })
      .then(function () {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        return liff.getProfile();
      })
      .then(function (profile) {
        if (!profile) return;
        displayName = profile.displayName;
        userId = profile.userId;
        document.getElementById("greeting").textContent = "こんにちは、" + displayName + "さん";
        show("screen-form");
      })
      .catch(function (err) {
        document.getElementById("screen-loading").textContent = "エラー：" + err.message;
      });
  </script>
</body>
</html>
